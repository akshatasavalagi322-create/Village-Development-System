<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script>
    async function loginUser(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:5000/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        console.log("Login Response:", data);
        alert(data.message || data.error);

        if (data.user_id) {
          // ✅ Store user_id and email in localStorage
          localStorage.setItem("user_id", data.user_id);
          localStorage.setItem("email", data.email);

          // ✅ Get user details and redirect accordingly
          await GetUserDetails(data.email);
        }

      } catch (err) {
        console.error("Error:", err);
        alert("Could not connect to backend. Is server running?");
      }
    }

    async function GetUserDetails(email) {
      try {
        const res = await fetch(`http://localhost:5000/userschemadet?email=${email}`, {
          method: "GET",
          headers: { "Content-Type": "application/json" }
        });

        const data = await res.json();
        console.log("User Details:", data);

        // ✅ Redirect based on usertype
        if (data.data[0].role === "user") {
          window.location.href = "index.html";
        } else if (data.data[0].role === "admin") {
          window.location.href = "Admin.html";
        } else if (data.data[0].role === "officer") {
          window.location.href = "Officer.html";
        } else {
          alert("Unknown user type");
        }

      } catch (err) {
        console.error("Error:", err);
        alert("Could not connect to backend. Is server running?");
      }
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-700">Login to your account</h2>

    <form onsubmit="loginUser(event)" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-600">Email</label>
        <input type="email" id="email" name="email" required
          class="w-full mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-600">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-200">
        Login
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      Don’t have an account?
      <a href="signup.html" class="text-green-500 hover:underline">Sign Up</a>
    </p>
  </div>

</body>

</html>
