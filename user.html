<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard - Village Development</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-5xl">
    <h2 class="text-3xl font-bold text-center text-green-700 mb-6">
      🌿 Village Development Dashboard
    </h2>

    <!-- Table Section -->
    <div id="userTableSection" class="mb-8 hidden">
      <h3 class="text-xl font-semibold mb-3 text-gray-700">Your Submitted Schemes</h3>
      <div class="overflow-x-auto">
        <table id="userTable" class="min-w-full border rounded-lg overflow-hidden">
          <thead class="bg-green-600 text-white">
            <tr>
              <th class="px-4 py-2 text-left">Full Name</th>
              <th class="px-4 py-2 text-left">Address</th>
              <th class="px-4 py-2 text-left">Village</th>
              <th class="px-4 py-2 text-left">Scheme</th>
              <th class="px-4 py-2 text-left">Mobile</th>
              <th class="px-4 py-2 text-left">Created At</th>
            </tr>
          </thead>
          <tbody id="userTableBody" class="bg-white divide-y"></tbody>
        </table>
      </div>
    </div>

    <!-- Form Section -->
    <div>
      <h3 class="text-xl font-semibold mb-3 text-gray-700">Submit New Scheme</h3>
      <form id="userForm" class="space-y-5">
        <div>
          <label class="block font-semibold mb-1">Full Name</label>
          <input type="text" id="fullname" required
            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-400 outline-none" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Address</label>
          <textarea id="address" rows="3" required
            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-400 outline-none"></textarea>
        </div>
        <div>
          <label class="block font-semibold mb-1">Village</label>
          <input type="text" id="village" required
            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-400 outline-none" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Select Development Scheme</label>
          <select id="scheme" required
            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-400 outline-none">
            <option value="">-- Choose a scheme --</option>
            <option value="water">💧 Clean Water Supply</option>
            <option value="education">📚 Education Improvement</option>
            <option value="roads">🛣️ Road Development</option>
            <option value="health">🏥 Health Facilities</option>
            <option value="agriculture">🌾 Agriculture Support</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold mb-1">Mobile Number</label>
          <input type="tel" id="mobile" required
            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-400 outline-none" />
        </div>
        <button type="submit"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition">
          ✅ Submit Form
        </button>
      </form>
    </div>
  </div>

  <script>

    let userId = Number(localStorage.getItem("user_id"));
    const gmail = localStorage.getItem("email");

    // Load user forms
    async function loadUserForms() {
      try {        
        const res = await fetch(`http://localhost:5000/userschemadet?email=${(gmail)}`, {
          method: "GET",
          headers: { "Content-Type": "application/json" }
        });

        const data = await res.json();

        if (data.data && data.data.length > 0) {
          document.getElementById("userTableSection").classList.remove("hidden");
          const tbody = document.getElementById("userTableBody");
          tbody.innerHTML = "";

          data.data.forEach(row => {
            tbody.innerHTML += `
              <tr>
                <td class="px-4 py-2">${row.fullname}</td>
                <td class="px-4 py-2">${row.address}</td>
                <td class="px-4 py-2">${row.village}</td>
                <td class="px-4 py-2">${row.scheme}</td>
                <td class="px-4 py-2">${row.mobile}</td>
                <td class="px-4 py-2">${new Date(row.created_at).toLocaleString()}</td>
              </tr>`;
          });
        }
      } catch (err) {
        console.error("Error fetching forms:", err);
      }
    }

    // Submit form
    document.getElementById("userForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        user_id: userId,
        fullname: document.getElementById("fullname").value,
        address: document.getElementById("address").value,
        village: document.getElementById("village").value,
        scheme: document.getElementById("scheme").value,
        mobile: document.getElementById("mobile").value
      };

      const res = await fetch("http://localhost:5000/userform", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await res.json();
      alert(result.message);

      loadUserForms();
    });

    loadUserForms();
  </script>
</body>

</html>
